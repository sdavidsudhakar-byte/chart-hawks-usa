name: US Stock Universe Refresh

on:
  schedule:
    # Every Saturday at 6:00 AM ET (11:00 UTC) — market closed, timing is loose
    - cron: '0 11 * * 6'
  workflow_dispatch:

jobs:
  refresh-tickers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write config.py
        run: |
          cat > config.py << 'PYEOF'
          DB_MODE = "neon"
          SCANNER_PORT = 8000
          TRADER_PORT  = 8001
          SIM_PORT     = 8002
          PYEOF

      - name: Run US stock universe refresh (S&P 500 + broader listings)
        run: python run_ticker_refresh.py
